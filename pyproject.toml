[dependency-groups]
dev = [
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.1",
    "pre-commit==4.6.1",
    "isort==8.0.1",
]

[tool.ruff]
# fix is opt-in via `--fix` (make lint, pre-commit) so a bare `ruff check` never
# silently rewrites the working tree.
fix = false
line-length = 100 # defaults to 88
target-version = "py313"
lint.select = ["E", "F", "B", "I"]  # pycodestyle, pyflakes, bugbear, isort
lint.ignore = [
    "E501",  # Line too long
    # --- Existing backlog: real rules, but too many pre-existing hits to gate on today.
    # TODO: burn these down file-by-file, then remove from ignore so they're enforced.
    "B008",  # function-call-in-default — 138 hits, mostly intentional DI helpers
    "B904",  # raise-without-from-inside-except — 186 hits, stylistic
    "B023",  # function-uses-loop-variable — 65 hits, needs per-site review (real bug class)
    "B007",  # unused-loop-variable — 35 hits
    "B905",  # zip-without-explicit-strict — 14 hits
    "E402",  # module-import-not-at-top — 12 hits, often intentional
    "B006",  # mutable-argument-default — 5 hits, fix needs per-call-site review
    "B012",  # return-in-finally (swallows exceptions) — 4 hits, control-flow-sensitive
    "B018",  # useless-expression — 3 hits, verify intent before removing
]

# FastAPI's dependency injectors are function calls in argument defaults by design,
# so B008 (function-call-in-default) is a false positive for them.
lint.flake8-bugbear.extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
    "fastapi.Security", "fastapi.params.Depends",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autobots"]
